<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - ServiConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forgot_password.css') }}">

</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">

            <div class="icon">
                🔐
            </div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your registered email address to reset your password.
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit">
                    Continue
                </button>

            </form>

            <a href="{{ url_for('login') }}" class="back-login">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
