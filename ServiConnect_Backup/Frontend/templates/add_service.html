<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Add Service | ServiConnect</title>

    <!-- Add Service CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_service.css') }}">

</head>


<body>

    <!-- =====================================================
         MAIN PAGE
         ===================================================== -->

    <div class="add-service-page">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="page-header">

            <!-- ServiConnect logo -->
            <div class="logo">
                <span>Servi</span>Connect
            </div>


            <!-- Back to dashboard -->
            <a href="{{ url_for('dashboard') }}"
               class="back-btn">

                ← Dashboard

            </a>

        </header>


        <!-- =================================================
             FORM CONTAINER
             ================================================= -->

        <div class="form-container">


            <!-- Page heading -->
            <div class="form-heading">

                <p class="small-title">
                    SERVICE PROVIDER
                </p>

                <h1>
                    Add a New Service
                </h1>

                <p>
                    Tell customers about the service you provide.
                </p>

            </div>


            <!-- =================================================
                 ADD SERVICE FORM
                 ================================================= -->

            <form action="{{ url_for('add_service') }}"
                  method="POST">


                <!-- SERVICE NAME -->
                <div class="form-group">

                    <label for="service_name">
                        Service Name
                    </label>

                    <input
                        type="text"
                        id="service_name"
                        name="service_name"
                        placeholder="e.g. Home Cleaning"
                        required>

                </div>


                <!-- CATEGORY -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>

                        <option value="">
                            Select a category
                        </option>

                        <option value="Home Cleaning">
                            Home Cleaning
                        </option>

                        <option value="Plumbing">
                            Plumbing
                        </option>

                        <option value="Electrical">
                            Electrical
                        </option>

                        <option value="Beauty & Salon">
                            Beauty & Salon
                        </option>

                        <option value="Appliance Repair">
                            Appliance Repair
                        </option>

                        <option value="Painting">
                            Painting
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PRICE -->
                <div class="form-group">

                    <label for="price">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="e.g. 500"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your service..."
                        rows="5"
                        required></textarea>

                </div>


                <!-- AVAILABILITY -->
                <div class="form-group">

                    <label for="availability">
                        Availability
                    </label>

                    <select
                        id="availability"
                        name="availability"
                        required>

                        <option value="Available">
                            Available
                        </option>

                        <option value="Unavailable">
                            Currently Unavailable
                        </option>

                    </select>

                </div>


                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    class="submit-btn">

                    Add Service →

                </button>


            </form>

        </div>

    </div>

</body>

</html>
