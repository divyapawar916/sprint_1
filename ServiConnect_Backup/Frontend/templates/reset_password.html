<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - ServiConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/reset_password.css') }}">

</head>

<body>

    <div class="reset-container">

        <div class="reset-card">

            <div class="icon">
                🔑
            </div>

            <h1>Reset Password</h1>

            <p>
                Enter your new password below.
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <a href="{{ url_for('login') }}" class="back-login">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
